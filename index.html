<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作品集</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--paper:#f6f2e9;--ink:#1d2b2a;--muted:#5f5e57;--line:rgba(29,43,42,.15);--accent:#2f5d5a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",sans-serif;line-height:1.8}
  main{max-width:760px;margin:0 auto;padding:96px 16px 72px}
  h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(36px,7vw,56px);letter-spacing:.1em;margin:0 0 48px}
  ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
  li{border-bottom:1px solid var(--line)}
  a{display:block;padding:28px 4px;color:inherit;text-decoration:none}
  a:hover h2,a:focus-visible h2{color:var(--accent)}
  h2{font-family:"Noto Serif TC",serif;font-weight:600;font-size:24px;margin:0;letter-spacing:.06em}
  p{margin:4px 0 0;color:var(--muted);font-size:15px}
</style>
</head>
<body>
<main>
  <h1>作品集</h1>
  <ul>
    <li><a href="river/"><h2>成為一條河</h2><p>五分港溪的生命圖譜</p></a></li>
    <li><a href="movies/"><h2>電影教會我的事</h2><p>三十個故事的人生電影｜顧蕙倩</p></a></li>
  </ul>
</main>
</body>
</html>
