<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>成為一條河｜五分港溪・十個金句</title>
<meta name="description" content="顧蕙倩〈成為一條河〉十個金句，五分港溪畔的十段風景。">
<meta property="og:type" content="website">
<meta property="og:locale" content="zh_TW">
<meta property="og:title" content="成為一條河｜五分港溪・十個金句">
<meta property="og:description" content="顧蕙倩〈成為一條河〉十個金句，五分港溪畔的十段風景。">
<meta property="og:url" content="https://kuwawa1020-design.github.io/kuwawa-website/river/">
<meta property="og:image" content="https://kuwawa1020-design.github.io/kuwawa-website/river/img/walk_4.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#1d2621">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="作品集">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;500;700&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#f6efe2;
    --ink-soft:rgba(246,239,226,.72);
    --paper:#f4efe4;
    --deep:#1d2621;
    --gold:#e6b86a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;
    background:var(--deep);color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- 封面 ---------- */
  .cover{
    min-height:100vh;display:grid;place-items:center;text-align:center;
    padding:12vh 8vw;position:relative;overflow:hidden;
    background:
      linear-gradient(180deg,rgba(29,38,33,.15) 0%,rgba(29,38,33,.55) 60%,var(--deep) 100%),
      url("img/walk_4.jpg") center/cover no-repeat;
  }
  .cover h1{
    font-weight:700;letter-spacing:.5em;margin-right:-.5em;
    font-size:clamp(2.6rem,7vw,5.2rem);line-height:1.2;
    text-shadow:0 2px 24px rgba(0,0,0,.45);
  }
  .cover .author{margin-top:1.4rem;font-size:clamp(1rem,2vw,1.25rem);letter-spacing:.6em;margin-right:-.6em;color:var(--ink-soft)}
  .cover .sub{margin-top:3.2rem;font-weight:300;font-size:.95rem;letter-spacing:.35em;color:var(--ink-soft)}
  .scroll-hint{
    position:absolute;left:50%;bottom:5vh;transform:translateX(-50%);
    font-size:.8rem;letter-spacing:.4em;color:var(--ink-soft);text-decoration:none;
    display:flex;flex-direction:column;align-items:center;gap:.6rem;
  }
  .scroll-hint::after{content:"";width:1px;height:42px;background:linear-gradient(var(--ink-soft),transparent);animation:drip 2.4s ease-in-out infinite}
  @keyframes drip{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

  /* ---------- 目次 ---------- */
  .toc{position:fixed;right:22px;top:50%;transform:translateY(-50%);z-index:10;display:flex;flex-direction:column;gap:12px}
  .toc a{display:block;width:8px;height:8px;border-radius:50%;background:rgba(246,239,226,.35);transition:.3s}
  .toc a.on{background:var(--gold);transform:scale(1.35)}
  @media (max-width:700px){.toc{display:none}}

  /* ---------- 每一段 ---------- */
  .stanza{
    position:relative;min-height:100vh;display:flex;align-items:center;
    padding:12vh 9vw;overflow:hidden;isolation:isolate;
  }
  .stanza .bg{
    position:absolute;inset:0;z-index:-2;
    background-size:cover;background-position:center;
    transform:scale(1.06);transition:transform 2.4s ease;
  }
  .stanza.in .bg{transform:scale(1)}
  .stanza::before{content:"";position:absolute;inset:0;z-index:-1}
  .stanza.left{justify-content:flex-start}
  .stanza.right{justify-content:flex-end}
  .stanza.left::before{background:linear-gradient(90deg,rgba(15,20,17,.78) 0%,rgba(15,20,17,.45) 45%,rgba(15,20,17,.05) 80%)}
  .stanza.right::before{background:linear-gradient(270deg,rgba(15,20,17,.78) 0%,rgba(15,20,17,.45) 45%,rgba(15,20,17,.05) 80%)}

  .card{
    display:flex;gap:2.2rem;align-items:flex-start;
    opacity:0;transform:translateY(28px);transition:opacity 1.4s ease .2s,transform 1.4s ease .2s;
  }
  .stanza.right .card{flex-direction:row-reverse}
  .stanza.in .card{opacity:1;transform:none}

  .num{
    writing-mode:vertical-rl;font-size:.95rem;letter-spacing:.5em;color:var(--gold);
    padding-top:.3rem;white-space:nowrap;
  }
  .num b{font-weight:500;font-size:1.6rem;letter-spacing:.1em;display:block;margin-bottom:.8rem}

  blockquote{
    writing-mode:vertical-rl;
    font-size:clamp(1.35rem,2.4vw,2rem);font-weight:500;
    line-height:2.1;letter-spacing:.22em;
    max-height:72vh;
    text-shadow:0 1px 18px rgba(0,0,0,.55);
  }
  blockquote span{display:block}
  .src{
    writing-mode:vertical-rl;font-size:.82rem;letter-spacing:.3em;color:var(--ink-soft);
    align-self:flex-end;white-space:nowrap;
  }

  /* 窄螢幕改為橫排 */
  @media (max-width:820px){
    .stanza{align-items:flex-end;padding:14vh 7vw 12vh}
    .stanza.left,.stanza.right{justify-content:flex-start}
    .stanza.left::before,.stanza.right::before{background:linear-gradient(0deg,rgba(15,20,17,.86) 0%,rgba(15,20,17,.5) 45%,rgba(15,20,17,.05) 85%)}
    .card,.stanza.right .card{flex-direction:column;gap:1.1rem}
    .num,blockquote,.src{writing-mode:horizontal-tb}
    .num b{display:inline;margin:0 .6rem 0 0}
    blockquote{font-size:1.32rem;line-height:1.95;letter-spacing:.08em;max-height:none}
    .src{align-self:flex-start}
  }

  /* ---------- 結尾 ---------- */
  .coda{
    min-height:70vh;display:grid;place-items:center;text-align:center;
    background:var(--paper);color:#2b332e;padding:14vh 8vw;
  }
  .coda p.line{font-size:clamp(1.3rem,2.6vw,1.9rem);letter-spacing:.4em;margin-right:-.4em;line-height:2}
  .coda .wave{width:120px;height:20px;margin:2.4rem auto}
  .coda .credit{font-size:.85rem;letter-spacing:.15em;color:#6b726c;line-height:2}
  @media (prefers-reduced-motion:reduce){
    .stanza .bg,.card{transition:none;transform:none!important;opacity:1}
    .scroll-hint::after{animation:none}
  }

  /* 回作品集 */
  .home{position:fixed;left:16px;top:16px;z-index:40;display:inline-flex;align-items:center;gap:8px;
    min-height:40px;padding:8px 16px 8px 12px;border-radius:999px;text-decoration:none;
    background:rgba(29,38,33,.72);color:#fff;font:500 14px/1 "Noto Sans TC",sans-serif;letter-spacing:.12em;
    box-shadow:0 6px 18px rgba(0,0,0,.25);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .home:hover{background:rgba(29,38,33,.92)}
  .home:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  .home svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2}

  /* 背景音樂 */
  .bgm{position:fixed;right:16px;bottom:16px;z-index:40;display:inline-flex;align-items:center;gap:10px;
    min-height:44px;padding:8px 18px 8px 10px;border:0;border-radius:999px;cursor:pointer;
    background:rgba(29,38,33,.85);color:#fff;font:500 14px/1 "Noto Sans TC",sans-serif;letter-spacing:.12em;
    box-shadow:0 6px 18px rgba(0,0,0,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .bgm:hover{background:rgba(29,38,33,.97)}
  .bgm:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  .bgm .ic{width:28px;height:28px;border-radius:50%;background:var(--gold);display:grid;place-items:center;flex:none}
  .bgm .ic svg{width:12px;height:12px;fill:#1d2621}
  .bgm .ic .pause{display:none}
  .bgm[aria-pressed="true"] .ic .play{display:none}
  .bgm[aria-pressed="true"] .ic .pause{display:block}
  .coda .credit a{color:#6b726c}
  .coda .back{display:inline-block;margin-top:1.6rem;color:#2b332e;font-size:.9rem;letter-spacing:.2em;text-decoration:none;border-bottom:1px solid #8a9a86;padding-bottom:2px}
</style>
</head>
<body>

<a class="home" href="../"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M9 2 4 7l5 5"/></svg>作品集</a>

<header class="cover" id="top">
  <div>
    <h1>成為一條河</h1>
    <p class="author">顧蕙倩</p>
    <p class="sub">五分港溪・十個金句</p>
  </div>
  <a class="scroll-hint" href="#s1">順流而下</a>
</header>

<nav class="toc" id="toc" aria-label="段落"></nav>

<main id="stanzas"></main>

<footer class="coda">
  <div>
    <p class="line">終究匯聚在一起<br>成為一條河</p>
    <svg class="wave" viewBox="0 0 120 20" fill="none" stroke="#8a9a86" stroke-width="1.4" aria-hidden="true">
      <path d="M0 10 Q 15 0 30 10 T 60 10 T 90 10 T 120 10"/>
    </svg>
    <p class="credit">文｜顧蕙倩〈成為一條河〉<br>背景音樂：史麥塔納〈莫爾道河〉（交響詩《我的祖國》選段）<br>演奏 Musopen Symphony・公有領域・來源 <a href="https://commons.wikimedia.org/wiki/File:Smetana_-_M%C3%A1_Vlast_-_Vltava_(Musopen_Symphony).flac">Wikimedia Commons</a></p>
    <a class="back" href="../">← 回作品集首頁</a>
  </div>
</footer>

<button class="bgm" type="button" id="bgm" aria-pressed="false" aria-label="播放背景音樂：史麥塔納〈莫爾道河〉">
  <span class="ic" aria-hidden="true">
    <svg class="play" viewBox="0 0 12 12"><path d="M3 1.5v9l7.5-4.5z"/></svg>
    <svg class="pause" viewBox="0 0 12 12"><path d="M2.5 1.5h2.5v9H2.5zM7 1.5h2.5v9H7z"/></svg>
  </span>
  <span class="lbl">背景音樂</span>
</button>
<audio id="bgm-audio" src="audio/vltava.mp3" loop preload="none"></audio>

<script>
const Q = [
  { img:"IMG_7296.jpg", from:"一、2023五分港溪",
    lines:["如水般流著，","如水般逝去，","生而為人，這就是人，你說。"] },
  { img:"IMG_7318.jpg", from:"一、2023五分港溪",
    lines:["我一直是破碎的。","我相信這條河也是。"] },
  { img:"IMG_7307.jpg", from:"一、2023五分港溪",
    lines:["地理空間無法定義它，","真正的它，必須回溯時間，","向時間一一呼告它。"] },
  { img:"IMG_7304.jpg", from:"一、2023五分港溪",
    lines:["河，從來不是安靜的。","從來也只是一滴水，","不再重現昔日回憶的一滴水。"] },
  { img:"walk_4.jpg", from:"一、2023五分港溪",
    lines:["那曾經留在時間軸的記憶，","一滴水，一滴、一滴水，","需要透過這條河，匯聚成河的模樣。"] },
  { img:"IMG_7319.jpg", from:"二、1896 五角金魚藻",
    lines:["這兩個月的植物採集與研究，","留住了永遠不再出現的時間。"] },
  { img:"IMG_7322.jpg", from:"二、1896 五角金魚藻",
    lines:["唯一不變的，","是那些任憑晨昏逝去，","依然冷眼千秋的草木蟲魚。"] },
  { img:"walk_1.jpg", from:"三、沒有一株草是雜草",
    lines:["每一株草","都有它來到這世上的理由。"] },
  { img:"walk_2.jpg", from:"三、沒有一株草是雜草",
    lines:["這一株水草，與一棵深山裡的參天神木，","對牧野富太郎而言，","在生物學上的價值是完全等同的。"] },
  { img:"walk_3.jpg", from:"三、沒有一株草是雜草",
    lines:["當認識了它的名字與特徵，","它就不再是面目模糊的雜草，","而是一個具體的生命。"] }
];
const CN = ["壹","貳","參","肆","伍","陸","柒","捌","玖","拾"];
const main = document.getElementById("stanzas");
const toc = document.getElementById("toc");

Q.forEach((q,i)=>{
  const s = document.createElement("section");
  s.className = "stanza " + (i%2 ? "left" : "right");
  s.id = "s"+(i+1);
  s.innerHTML = `
    <div class="bg" style="background-image:url('img/${q.img}')"></div>
    <div class="card">
      <div class="num"><b>${CN[i]}</b></div>
      <blockquote>${q.lines.map(l=>`<span>${l}</span>`).join("")}</blockquote>
      <div class="src">——〈${q.from}〉</div>
    </div>`;
  main.appendChild(s);
  const a = document.createElement("a");
  a.href = "#"+s.id; a.title = CN[i];
  toc.appendChild(a);
});

const dots = [...toc.children];
const io = new IntersectionObserver(es=>{
  es.forEach(e=>{
    if(e.isIntersecting){
      e.target.classList.add("in");
      const k = [...main.children].indexOf(e.target);
      dots.forEach((d,j)=>d.classList.toggle("on", j===k));
    }
  });
},{threshold:.45});
[...main.children].forEach(s=>io.observe(s));

(function(){
  var bgm = document.getElementById('bgm'), au = document.getElementById('bgm-audio');
  au.volume = 0.6;
  bgm.addEventListener('click', function(){ au.paused ? au.play().catch(function(){}) : au.pause(); });
  au.addEventListener('play', function(){ bgm.setAttribute('aria-pressed','true'); bgm.setAttribute('aria-label','暫停背景音樂'); });
  au.addEventListener('pause', function(){ bgm.setAttribute('aria-pressed','false'); bgm.setAttribute('aria-label','播放背景音樂：史麥塔納〈莫爾道河〉'); });
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('../sw.js',{scope:'../'}).catch(function(){});});}</script>
</body>
</html>
